<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stratum Advisory — AI-powered strategy consulting engagement platform. From intake to polished deliverable, powered by specialised AI agents with citations on every claim." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stratum.com/" />

    <meta property="og:image" content="https://website-v3-assets.s3.amazonaws.com/assets/img/hero/Stratum-og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stratum.com/" />
    <meta property="twitter:title" content="Stratum Advisory — AI Consulting Platform" />
    <meta property="twitter:description" content="AI-powered strategy consulting engagement platform. From intake to polished deliverable, powered by specialised AI agents." />

    <title>Stratum Advisory — AI Consulting Platform</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('stratum_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
